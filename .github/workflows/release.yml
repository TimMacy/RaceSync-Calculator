name: Build App

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and publish macOS app
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build universal macOS app
        run: bash ./build.sh
      - name: Package app
        run: ditto -c -k --sequesterRsrc --keepParent 'RaceSync Calculator.app' 'RaceSync-Calculator-macOS-universal.zip'
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create v1.0 'RaceSync-Calculator-macOS-universal.zip' --target "$GITHUB_SHA" --title 'RaceSync Calculator v1.0' --notes "" --latest
